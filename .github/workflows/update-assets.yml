
name: Update WordPress.org Assets

on:
  push:
    branches:
      - master
    paths:
      - '.wordpress-org/**'

  workflow_dispatch:

jobs:
  update-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare WordPress.org readme
        run: |
          if [ ! -f readme.txt ]; then
            curl -fLsS \
              https://plugins.svn.wordpress.org/ubigeo-peru/trunk/readme.txt \
              -o readme.txt
          fi

          test -s readme.txt
          echo "Readme disponible"

      - name: Update WordPress.org assets
        uses: 10up/action-wordpress-plugin-asset-update@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ubigeo-peru
          ASSETS_DIR: .wordpress-org
          IGNORE_OTHER_FILES: true
